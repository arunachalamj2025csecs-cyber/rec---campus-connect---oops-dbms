# Runs MongoDB and the Java API together on your computer.
# Start:  docker compose up --build      Stop: docker compose down
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/campusconnect
    ports:
      - "8080:8080"

volumes:
  mongo-data:
