# ---------------------------------------------------------------
# REC CampusConnect backend configuration.
# Every value can be overridden with an environment variable of the same
# name (shown after the colon in ${...}). Never put real secrets in this file.
# ---------------------------------------------------------------

spring.application.name=campus-connect-api

# Port the web server listens on (Render and other hosts set PORT for you).
server.port=${PORT:8080}

# MongoDB connection string. Local default: a MongoDB server on this computer.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/campusconnect}
spring.data.mongodb.auto-index-creation=true

# Google sign-in: the OAuth "Web client" ID from Google Cloud Console.
app.google-client-id=${GOOGLE_CLIENT_ID:}

# Administrator email addresses (comma-separated, exact addresses only).
app.admin-emails=${ADMIN_EMAILS:admin@rajalakshmi.edu.in}

# Secret typed on the admin registration form. Leave empty to turn admin registration off.
app.admin-registration-key=${ADMIN_REGISTRATION_KEY:}

# Websites allowed to call this API (comma-separated, no trailing slash).
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:https://campus-connect-1-mu.vercel.app,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# How long a login lasts, in hours.
app.session-hours=${SESSION_HOURS:6}

# Time zone used to decide whether an event is upcoming.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Dates are written as plain text such as 2026-11-05, not as numbers.
spring.jackson.serialization.write-dates-as-timestamps=false
